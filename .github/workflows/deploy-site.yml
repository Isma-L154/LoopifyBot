name: Deploy site

# Deploys site/ to Cloudflare only after the Tests workflow passed on main, so
# a page whose command list drifted from the bot never goes live.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Never cancel a deploy halfway; a newer one simply runs after it.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://loopify.cloudils.com/
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit Tests ran on, not whatever main points to by now.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Third-party action handed the Cloudflare token: pinned to a commit
      # (v4.1.3), not a movable tag.
      - uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          workingDirectory: site
          command: deploy
