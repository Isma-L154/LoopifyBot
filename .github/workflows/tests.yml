name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what Ubuntu 24.04 ships, which is what the bot is deployed on.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FFmpeg
        # tests/test_effect_filters.py renders real audio to verify the filter
        # presets. Without FFmpeg those tests skip silently, which would let a
        # broken filter through CI.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # The suite needs no credentials, no network and no .env.
        # -ra surfaces anything that skipped, so silent skips stay visible.
        run: pytest -ra
