name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Every action is pinned to a commit, with its version in a trailing comment
# that Dependabot keeps current: a tag can be moved by whoever controls the
# action, and the deploy job hands one of them the Cloudflare token.
#
# The job only reads the repo. Without this, GITHUB_TOKEN gets the repository's
# default scopes, which can include write access.
permissions:
  contents: read

# A new push to a PR makes the run for the previous one pointless. Runs on main
# are left to finish, so a newer push never cancels a deploy halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps run third-party code (pip install); none of it needs
          # the token, so it is not left in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        # Correctness rules only (see ruff.toml): an undefined name in a
        # rarely-run branch otherwise surfaces as a crash in production.
        run: ruff check .

      - name: Type check
        # Every function must be annotated (see mypy.ini).
        run: mypy

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is both what the server runs (deploy/setup.sh) and the newest
        # release. When a newer one ships, add it here so a dependency that
        # breaks on it shows up before the server moves. The check name
        # "pytest (3.14)" is a required check on main.
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps run third-party code (pip install); none of it needs
          # the token, so it is not left in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FFmpeg
        # tests/test_effect_filters.py renders real audio to verify the filter
        # presets. Without FFmpeg those tests skip silently, which would let a
        # broken filter through CI.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # The suite needs no credentials, no network and no .env.
        # -ra surfaces anything that skipped, so silent skips stay visible.
        run: pytest -ra

  deploy-site:
    # Publishes site/ only from a push to main that passed every check, so a
    # page whose command list drifted from the bot never goes live. Pull
    # requests, forks included, never reach this job or its secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, pytest]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://loopify.cloudils.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          workingDirectory: site
          command: deploy
