name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repo. Without this, GITHUB_TOKEN gets the repository's
# default scopes, which can include write access.
permissions:
  contents: read

# A new push to a PR makes the run for the previous one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        # Correctness rules only (see ruff.toml): an undefined name in a
        # rarely-run branch otherwise surfaces as a crash in production.
        run: ruff check .

      - name: Type check
        # Every function must be annotated (see mypy.ini).
        run: mypy

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is both what the server runs (deploy/setup.sh) and the newest
        # release. When a newer one ships, add it here so a dependency that
        # breaks on it shows up before the server moves. The check name
        # "pytest (3.14)" is a required check on main.
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FFmpeg
        # tests/test_effect_filters.py renders real audio to verify the filter
        # presets. Without FFmpeg those tests skip silently, which would let a
        # broken filter through CI.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # The suite needs no credentials, no network and no .env.
        # -ra surfaces anything that skipped, so silent skips stay visible.
        run: pytest -ra
