[mypy]
python_version = 3.12
files = main.py, config.py, cogs, services, utils
# The project is a set of top-level packages rather than one installed package.
explicit_package_bases = True
# The project rule: every function carries type hints.
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True

# Neither ships type information.
[mypy-yt_dlp.*]
ignore_missing_imports = True

[mypy-lyricsgenius.*]
ignore_missing_imports = True
